[package]
name = "sim-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hecs = { workspace = true }
serde = { workspace = true }
glam = { workspace = true }
ron = { workspace = true }
ahash = { workspace = true }
thiserror = { workspace = true }
arrayvec = { version = "0.7", features = ["serde"] }

[features]
# PERF2-0: A* search wall time (`nav::search_ns`) for `worldsim_perf perf2-sim`.
# Never on by default; enabled only through sim-systems/subprofile.
subprofile = []

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1"

[[bench]]
name = "material_benchmarks"
harness = false
