[package]
name = "sim-systems"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hecs = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
sim-core = { path = "../sim-core" }
sim-engine = { path = "../sim-engine" }

[features]
# Pass 18: per-scope timing of the decision system (`subprofile` module and
# `scope!`). Never on by default; built only in a separate target directory.
subprofile = []

# M-CORE arm instrumentation; never enabled by default.
perf_arms = []

# Read-only old-arm shadow observation; independent of timing instrumentation.
mind_shadow = []

# Explicit pre-switch colony calibration; retained as a build marker after the switch.
mind_candidate = []
