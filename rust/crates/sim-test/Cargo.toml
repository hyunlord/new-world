[package]
name = "sim-test"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WorldSim test harness — long-running simulation tests + integration scenarios"

[dependencies]
hecs = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
sim-core = { path = "../sim-core" }
sim-engine = { path = "../sim-engine" }
sim-systems = { path = "../sim-systems" }
sim-bridge = { path = "../sim-bridge" }

serde_json = "1"

[features]
# Pass 18: forwards sim-systems' `subprofile` timing scopes into
# `worldsim_perf`'s JSON. Never on by default and never a required feature.
subprofile = ["sim-systems/subprofile"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "phase2_benchmarks"
harness = false

[[bin]]
name = "worldsim_probe"
path = "src/bin/worldsim_probe.rs"

[[bin]]
name = "worldsim_perf"
path = "src/bin/worldsim_perf.rs"

[[bin]]
name = "worldsim_systems"
path = "src/bin/worldsim_systems.rs"
