[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-engine",
    "crates/sim-systems",
    "crates/sim-test",
    "crates/sim-bridge",
]
exclude = []

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hyunlord/new-world"
rust-version = "1.93"

[workspace.dependencies]
hecs = "0.10"
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
rayon = "1.10"
glam = "0.30"
ahash = "0.8"
thiserror = "1.0"
criterion = "0.5"
godot = "0.4"
bincode = "1.3"

# D-SIMFIX1-25: the debug Godot library (dev profile) runs the simulation crates at opt-level 2 so the
# periodic steward pass fits a frame; debug assertions and overflow checks stay on (dev defaults).
[profile.dev.package.sim-core]
opt-level = 2

[profile.dev.package.sim-engine]
opt-level = 2

[profile.dev.package.sim-systems]
opt-level = 2

[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.sim-systems]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# PERF2-1 A: the library the game loads (sim_bridge.gdextension macos.debug = rust/target/game/). Every crate,
# the bridge's dependencies included, at opt-level 3 with debug assertions and overflow checks off, thin LTO.
# Its own profile (own target/game dir) so cargo test/clippy --release never relink the game's dylib with
# workspace-unified features. `tools/play.sh --dev` loads the dev-profile library instead (debugging).
[profile.game]
inherits = "release"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1
incremental = false
