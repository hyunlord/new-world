<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Anonymous animation evidence viewer">
<title>Specimens</title><link rel="stylesheet" href="browser_lab.css">

<body><header><h1>Specimens</h1>
<div class="toolbar">

</div><p id="status" role="status">Loading specimens…</p></header>

</body></html>
